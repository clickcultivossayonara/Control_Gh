<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empleados — Cultivos Sayonara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f6f5f0; --surface: #ffffff; --ink: #1d2420; --ink-soft: #57625b; --ink-faint: #8a9089;
    --line: #dbdfd4; --line-strong: #c4cabb; --accent: #2e6b4e; --accent-ink: #ffffff;
    --accent-soft: #e3eee6; --accent-soft-line: #c3ddca; --warn: #b3742f; --warn-soft: #f6e9d7;
    --critical: #a23d3d; --critical-soft: #f6e0e0;
    --shadow: 0 1px 2px rgba(29, 36, 32, 0.06), 0 4px 16px rgba(29, 36, 32, 0.05);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14180f; --surface: #1b211a; --ink: #eaf0e6; --ink-soft: #a8b3a3; --ink-faint: #6c766a;
      --line: #2c332a; --line-strong: #3b453a; --accent: #6fbf8f; --accent-ink: #0d1a10;
      --accent-soft: #223229; --accent-soft-line: #35503d; --warn: #e0a75c; --warn-soft: #3a2f1a;
      --critical: #e08080; --critical-soft: #3a2020;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14180f; --surface: #1b211a; --ink: #eaf0e6; --ink-soft: #a8b3a3; --ink-faint: #6c766a;
    --line: #2c332a; --line-strong: #3b453a; --accent: #6fbf8f; --accent-ink: #0d1a10;
    --accent-soft: #223229; --accent-soft-line: #35503d; --warn: #e0a75c; --warn-soft: #3a2f1a;
    --critical: #e08080; --critical-soft: #3a2020;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 22px 24px 48px; display: flex; flex-direction: column; gap: 22px; }

  .masthead { display: flex; flex-direction: column; align-items: center; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 16px; text-align: center; }
  .masthead h1 { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: clamp(26px, 4vw, 36px); margin: 0; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; }
  .masthead .sub { font-size: 13px; color: var(--ink-soft); }
  .masthead a { color: var(--accent); text-decoration: none; }
  .masthead a:hover { text-decoration: underline; }

  section.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; }
  h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 19px; margin: 0 0 16px; }

  .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; }
  .field label .req { color: var(--critical); }
  .field input[type=text], .field input[type=number], .field input[type=email], .field input[type=date], .field select {
    font: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--paper); color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field.checkbox { flex-direction: row; align-items: center; gap: 8px; }
  .field.checkbox label { text-transform: none; font-size: 14px; letter-spacing: normal; color: var(--ink); font-weight: 500; }
  .field.checkbox input { accent-color: var(--accent); width: 16px; height: 16px; }
  .checks-group { flex-direction: row; align-items: center; gap: 20px; }
  .checks-group .field.checkbox { gap: 8px; }

  .form-actions { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .btn-primary {
    font: inherit; font-size: 14px; font-weight: 600; padding: 10px 22px; border-radius: 7px; border: none;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.5; cursor: wait; }
  .form-msg { font-size: 13.5px; font-weight: 500; }
  .form-msg.ok { color: var(--accent); }
  .form-msg.error { color: var(--critical); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 14px; }
  .filters .field { min-width: 160px; }
  .result-count { font-size: 12.5px; color: var(--ink-faint); margin-left: auto; align-self: center; white-space: nowrap; }
  .clear-btn {
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px;
    border-radius: 7px; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
  }
  .clear-btn:hover { border-color: var(--accent); color: var(--accent); }

  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 12.5px; table-layout: fixed; }
  thead th {
    position: sticky; top: 0; background: var(--ink); color: var(--paper); text-align: left; padding: 8px 8px;
    font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  thead th:hover { background: var(--accent); }
  thead th .arrow { opacity: 0.5; font-size: 9px; margin-left: 3px; }
  thead th.sorted .arrow { opacity: 1; }
  tbody td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th:nth-child(1), td:nth-child(1) { width: 12%; }
  th:nth-child(2), td:nth-child(2) { width: 24%; }
  th:nth-child(3), td:nth-child(3) { width: 22%; }
  th:nth-child(4), td:nth-child(4) { width: 10%; }
  th:nth-child(5), td:nth-child(5) { width: 20%; }
  th:nth-child(6), td:nth-child(6) { width: 12%; }
  th:nth-child(7), td:nth-child(7) { width: 10%; }
  tbody tr:hover td { background: var(--accent-soft); }
  tbody tr:nth-child(even) td { background: rgba(0,0,0,0.012); }
  tbody tr:nth-child(even):hover td { background: var(--accent-soft); }
  .cedula { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--ink-soft); }
  .nombre { font-weight: 500; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.ok { background: var(--accent-soft); color: var(--accent); }
  .chip.off { background: var(--critical-soft); color: var(--critical); }
  .empty-state { padding: 40px 20px; text-align: center; color: var(--ink-faint); font-size: 14px; }

  footer { font-size: 12px; color: var(--ink-faint); text-align: center; }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <h1>Empleados</h1>
    <div class="sub"><img src="logo-sayonara.png" alt="Cultivos Sayonara" style="height:18px;width:auto;vertical-align:middle;margin-right:4px"> &middot; <a href="index.html">Inicio</a> &middot; <a href="registro-biometrico.html">Ver registro de asistencia</a> &middot; <a href="novedades.html">Novedades de nómina</a></div>
    <div class="sesion-box" id="sesion-box" style="justify-content:center"></div>
  </div>

  <section class="card" id="card-agregar-empleado">
    <h2>Agregar empleado</h2>
    <form id="form-empleado">
      <div class="form-grid">
        <div class="field">
          <label for="f-cedula">Cédula <span class="req">*</span></label>
          <input type="text" id="f-cedula" required inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-nombre">Nombre <span class="req">*</span></label>
          <input type="text" id="f-nombre" required autocomplete="off" style="text-transform:uppercase">
        </div>
        <div class="field">
          <label for="f-area">Área</label>
          <select id="f-area">
            <option value="">—</option>
          </select>
        </div>
        <div class="field">
          <label for="f-labor">Labor</label>
          <select id="f-labor">
            <option value="">—</option>
          </select>
        </div>
        <div class="field">
          <label for="f-sede">Sede</label>
          <select id="f-sede">
            <option value="Unión" selected>Unión</option>
            <option value="Ceja">Ceja</option>
          </select>
        </div>
        <div class="field">
          <label for="f-eficiencia">Eficiencia</label>
          <select id="f-eficiencia">
            <option value="">—</option>
            <option value="Cuenta">Cuenta</option>
            <option value="No Cuenta">No Cuenta</option>
          </select>
        </div>
        <div class="field">
          <label for="f-fecha-ingreso">Fecha Ingreso</label>
          <input type="date" id="f-fecha-ingreso">
        </div>
        <div class="field checks-group">
          <div class="field checkbox">
            <input type="checkbox" id="f-activo" checked>
            <label for="f-activo">Activo</label>
          </div>
          <div class="field checkbox">
            <input type="checkbox" id="f-administrativo">
            <label for="f-administrativo">Administrativo</label>
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="btn-guardar">Guardar empleado</button>
        <span class="form-msg" id="form-msg"></span>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>Empleados registrados</h2>
    <div class="filters">
      <div class="field">
        <label for="f-buscar">Cédula o nombre</label>
        <input type="text" id="f-buscar" placeholder="Ej. 1193599748 o Roqueme…" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-filtro-area">Área</label>
        <select id="f-filtro-area"><option value="">Todas</option></select>
      </div>
      <div class="field">
        <label for="f-filtro-estado">Estado</label>
        <select id="f-filtro-estado">
          <option value="">Todos</option>
          <option value="true">Activos</option>
          <option value="false">Inactivos</option>
        </select>
      </div>
      <div class="field">
        <label for="f-filtro-desde">Ingreso desde</label>
        <input type="date" id="f-filtro-desde">
      </div>
      <div class="field">
        <label for="f-filtro-hasta">Ingreso hasta</label>
        <input type="date" id="f-filtro-hasta">
      </div>
      <button class="clear-btn" id="btn-limpiar">Limpiar filtros</button>
      <span class="result-count" id="result-count"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th data-key="cedula">Cédula <span class="arrow">↕</span></th>
            <th data-key="nombre">Nombre <span class="arrow">↕</span></th>
            <th data-key="area">Área <span class="arrow">↕</span></th>
            <th data-key="sede">Sede <span class="arrow">↕</span></th>
            <th data-key="labor">Labor <span class="arrow">↕</span></th>
            <th data-key="fecha_ingreso">Ingreso <span class="arrow">↕</span></th>
            <th data-key="activo">Estado <span class="arrow">↕</span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <footer>Datos en vivo desde Supabase &middot; Cultivos Sayonara</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
AUTH_READY.then(function () {
  if (!requireRole(["admin", "nomina", "jefe_area", "supervisor"])) return;
  pintarSesion("sesion-box");
  if (["jefe_area", "supervisor"].includes(window.SESION.rol)) {
    document.getElementById("card-agregar-empleado").hidden = true;
  }

  const SUPABASE_URL = "https://kgtwqywbowhllxqdjegi.supabase.co";

  const AREAS_CONOCIDAS = ["ADMINISTRACIÓN","ALSTROMERIA","AMBIENTAL","ASPERSIÓN","CALIDAD","CONFINAMIENTO CEJA","CORTE","CORTE CEJA","COSECHA ABUELAS CEJA","COSECHA CEJA","DESBOTONE","DESBOTONE CEJA","ESTERILIZACIÓN","FITOSANIDAD","LIMONIUM","MANTENIMIENTO","MANTENIMIENTO CEJA","MIPE CEJA","OFICIOS VARIOS","POSCOSECHA CEJA","POSTCOSECHA","PRODUCCIÓN CEJA","PROPAGACIÓN CONFINAMIENTO","PROPAGACIÓN COSECHA","REVISION POSCOSECHA","RIEGO","RIEGO CEJA","SERVICIOS","SERVICIOS CEJA","SIEMBRA","SIEMBRA CEJA","UNIQUE CREATION"];
  const selArea = document.getElementById("f-area");
  AREAS_CONOCIDAS.forEach(a => selArea.insertAdjacentHTML("beforeend", `<option value="${a}">${a}</option>`));

  const ROL_AREA_LIMITADA = ["jefe_area", "supervisor"];
  const AREAS_FILTRO = ROL_AREA_LIMITADA.includes(window.SESION.rol)
    ? AREAS_CONOCIDAS.filter(a => window.SESION.areas.includes(a))
    : AREAS_CONOCIDAS;
  const selFiltroArea = document.getElementById("f-filtro-area");
  AREAS_FILTRO.forEach(a => selFiltroArea.insertAdjacentHTML("beforeend", `<option value="${a}">${a}</option>`));

  const LABORES_CONOCIDAS = ["ARMADO BOUQUETS","ASEGURADOR DE FITOSANIDAD POSTCOSECHA.","ASEGURAMIENTO USA","ASPERJADOR.","ASPIRADO.","AUXILIAR","AYUDANTE DE TALLER,FONTANERIA, LABORES VARIAS.","CARGUE DE GARRUCHA ESQUEJES","CORTADOR","CORTE ALSTROEMERIAS","CORTE ESPECIALES","CORTE USA","COSECHADOR","COSECHADOR CEJA","CUARTO FRIO","DESBOTONE CREMON/SPIDER","DESBOTONE POMPON","DESBOTÓN SPIDER","DESCARGUE BANDEJAS CONFINAMIENTO","DESCARGUE DE GARRUCHA","DESMALECE","DESPACHOS","DESTRONCAR","DESTRONQUE Y ENTERRADA DE SOCA","DISTRIBUCION CUBETAS","DRENCH","ELECTRICO Y MANTENIMIENTOS PREVENTIVOS.","EMPAQUE","EMPAQUE BOUQUETS","ENMALLE","ESTERILIZACION","ESTERILIZACIÓN DE CAMAS","FOSFINA-TERMONEBULIZADORA","FUMIGACIÓN","INSTALACION DE LUCES Y CORTINAS NEGRAS EN SIEMBRA.","JEFE","LLENADO DE BANDEJAS MANUAL","LLENADOR DE BANDEJAS","MANTENIMIENTO EN ALTURAS.","MONITOREO","MONITOREO INTEGRAL","MONITOREO ROYA BLANCA","OF VARIOS","OFICIOS VARIOS","Orden y aseo","PATINADOR","PREPARACIÓN DE CAMAS","PUESTA DE MALLA.","REGISTRO DE GARRUCHA","REVISION DE LUCES EN LA NOCHE.","REVISIÓN FITOSANITARIO EN POSTCOSECHA","REVISIÓN RB","RIEGO","RIEGO CON CODO EN CORTE","RIEGO CON CODO UNIFICACION","RIEGO SIEMBRA","SIEMBRA","SIEMBRA CAMPO","SIEMBRA EN CAMPO","SIEMBRA ENRAIZAMIENTO","SUPERVISOR","Surtidor de cartón","TALLER.","TANQUISTA","TRACTORISTA"];
  const selLabor = document.getElementById("f-labor");
  LABORES_CONOCIDAS.forEach(l => selLabor.insertAdjacentHTML("beforeend", `<option value="${l}">${l}</option>`));

  // Cedula: solo digitos
  document.getElementById("f-cedula").addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, "");
  });

  // Nombre: siempre en mayusculas
  document.getElementById("f-nombre").addEventListener("input", (e) => {
    const pos = e.target.selectionStart;
    e.target.value = e.target.value.toUpperCase();
    e.target.setSelectionRange(pos, pos);
  });

  // Fecha de ingreso: hoy por defecto
  const elFechaIngreso = document.getElementById("f-fecha-ingreso");
  function fechaHoy() { return new Date().toISOString().slice(0, 10); }
  elFechaIngreso.value = fechaHoy();

  // ---------- formulario ----------
  const form = document.getElementById("form-empleado");
  const btnGuardar = document.getElementById("btn-guardar");
  const msg = document.getElementById("form-msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const cedula = document.getElementById("f-cedula").value.trim();
    const nombre = document.getElementById("f-nombre").value.trim();
    if (!cedula || !/^\d+$/.test(cedula)) {
      msg.textContent = "La cédula es obligatoria y debe ser numérica.";
      msg.className = "form-msg error";
      return;
    }
    if (!nombre) {
      msg.textContent = "El nombre es obligatorio.";
      msg.className = "form-msg error";
      return;
    }

    const val = (id) => document.getElementById(id).value.trim() || null;

    const registro = {
      cedula: Number(cedula),
      nombre: nombre.toUpperCase(),
      area: val("f-area"),
      sede: val("f-sede"),
      labor: val("f-labor"),
      eficiencia: val("f-eficiencia"),
      fecha_ingreso: val("f-fecha-ingreso"),
      activo: document.getElementById("f-activo").checked,
      administrativo: document.getElementById("f-administrativo").checked,
    };

    btnGuardar.disabled = true;
    msg.textContent = "Guardando...";
    msg.className = "form-msg";

    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/employees`, {
        method: "POST",
        headers: { ...authHeaders(), "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify([registro]),
      });

      if (!resp.ok) {
        const texto = await resp.text();
        if (resp.status === 409 || texto.includes("duplicate key")) {
          throw new Error(`Ya existe un empleado con la cédula ${cedula}.`);
        }
        throw new Error(texto);
      }

      msg.textContent = `Empleado "${nombre}" guardado correctamente.`;
      msg.className = "form-msg ok";
      form.reset();
      document.getElementById("f-activo").checked = true;
      elFechaIngreso.value = fechaHoy();
      cargarEmpleados();
    } catch (err) {
      msg.textContent = "No se pudo guardar: " + (err.message || err);
      msg.className = "form-msg error";
    } finally {
      btnGuardar.disabled = false;
    }
  });

  // ---------- tabla ----------
  const elBuscar = document.getElementById("f-buscar");
  const elArea = document.getElementById("f-filtro-area");
  const elEstado = document.getElementById("f-filtro-estado");
  const elDesde = document.getElementById("f-filtro-desde");
  const elHasta = document.getElementById("f-filtro-hasta");
  const elBody = document.getElementById("tbody");
  const elCount = document.getElementById("result-count");

  let sortKey = "activo", sortDir = -1;
  function construirOrder() {
    const dir = sortDir === 1 ? "asc" : "desc";
    if (sortKey === "activo") return `activo.${dir},fecha_ingreso.desc.nullslast`;
    if (sortKey === "fecha_ingreso") return `fecha_ingreso.${dir}.nullslast`;
    return `${sortKey}.${dir}`;
  }

  async function cargarEmpleados() {
    const params = new URLSearchParams();
    params.set("select", "cedula,nombre,area,sede,labor,fecha_ingreso,activo");
    params.set("order", construirOrder());
    params.set("limit", "500");

    const buscar = elBuscar.value.trim();
    if (buscar) {
      if (/^\d+$/.test(buscar)) params.set("cedula_texto", "ilike.*" + buscar + "*");
      else params.set("nombre", "ilike.*" + buscar.replace(/[,()]/g, "") + "*");
    }
    if (elArea.value) params.set("area", "eq." + elArea.value);
    if (elEstado.value) params.set("activo", "eq." + elEstado.value);
    if (elDesde.value) params.append("fecha_ingreso", "gte." + elDesde.value);
    if (elHasta.value) params.append("fecha_ingreso", "lte." + elHasta.value);

    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/employees_detalle?${params.toString()}`, {
        headers: { ...authHeaders(), Prefer: "count=exact" },
      });
      const filas = await resp.json();
      if (!resp.ok) throw new Error(filas.message || `HTTP ${resp.status}`);
      const rango = resp.headers.get("content-range");
      const total = rango && rango.includes("/") ? Number(rango.split("/")[1]) : filas.length;

      if (filas.length === 0) {
        elBody.innerHTML = `<tr><td colspan="7"><div class="empty-state">Sin empleados para estos filtros.</div></td></tr>`;
      } else {
        elBody.innerHTML = filas.map(f => `<tr>
          <td class="cedula">${f.cedula}</td>
          <td class="nombre" title="${f.nombre}">${f.nombre}</td>
          <td title="${f.area || ""}">${f.area || "—"}</td>
          <td>${f.sede || "—"}</td>
          <td title="${f.labor || ""}">${f.labor || "—"}</td>
          <td>${f.fecha_ingreso ? f.fecha_ingreso.slice(0, 10).split("-").reverse().join("/") : "—"}</td>
          <td>${f.activo ? '<span class="chip ok">Activo</span>' : '<span class="chip off">Inactivo</span>'}</td>
        </tr>`).join("");
      }
      elCount.textContent = total.toLocaleString("es-CO") + " empleado" + (total === 1 ? "" : "s");
    } catch (err) {
      elBody.innerHTML = `<tr><td colspan="7"><div class="empty-state">Error al cargar: ${err.message || err}</div></td></tr>`;
      elCount.textContent = "";
    }

    document.querySelectorAll("thead th[data-key]").forEach((th) => {
      th.classList.toggle("sorted", th.dataset.key === sortKey);
      const arrow = th.querySelector(".arrow");
      if (arrow) arrow.textContent = th.dataset.key === sortKey ? (sortDir === 1 ? "↑" : "↓") : "↕";
    });
  }

  document.querySelectorAll("thead th[data-key]").forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = -1; }
      cargarEmpleados();
    });
  });

  let buscarTimeout;
  elBuscar.addEventListener("input", () => { clearTimeout(buscarTimeout); buscarTimeout = setTimeout(cargarEmpleados, 300); });
  elArea.addEventListener("change", cargarEmpleados);
  elEstado.addEventListener("change", cargarEmpleados);
  elDesde.addEventListener("change", cargarEmpleados);
  elHasta.addEventListener("change", cargarEmpleados);
  document.getElementById("btn-limpiar").addEventListener("click", () => {
    elBuscar.value = "";
    elArea.value = "";
    elEstado.value = "";
    elDesde.value = "";
    elHasta.value = "";
    cargarEmpleados();
  });

  cargarEmpleados();
});
</script>
</body>
</html>
