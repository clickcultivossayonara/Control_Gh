<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restablecer contraseña — Cultivos Sayonara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f6f5f0; --surface: #ffffff; --ink: #1d2420; --ink-soft: #57625b; --ink-faint: #8a9089;
    --line: #dbdfd4; --line-strong: #c4cabb; --accent: #2e6b4e; --accent-ink: #ffffff;
    --accent-soft: #e3eee6; --accent-soft-line: #c3ddca; --critical: #a23d3d; --critical-soft: #f6e0e0;
    --shadow: 0 1px 2px rgba(29, 36, 32, 0.06), 0 4px 16px rgba(29, 36, 32, 0.05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14180f; --surface: #1b211a; --ink: #eaf0e6; --ink-soft: #a8b3a3; --ink-faint: #6c766a;
      --line: #2c332a; --line-strong: #3b453a; --accent: #6fbf8f; --accent-ink: #0d1a10;
      --accent-soft: #223229; --accent-soft-line: #35503d; --critical: #e08080; --critical-soft: #3a2020;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14180f; --surface: #1b211a; --ink: #eaf0e6; --ink-soft: #a8b3a3; --ink-faint: #6c766a;
    --line: #2c332a; --line-strong: #3b453a; --accent: #6fbf8f; --accent-ink: #0d1a10;
    --accent-soft: #223229; --accent-soft-line: #35503d; --critical: #e08080; --critical-soft: #3a2020;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 34px 30px; display: flex;
    flex-direction: column; gap: 20px;
  }
  .marca { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); font-weight: 700; text-align: center; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 22px; margin: 0; text-align: center; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; }
  .field input {
    font: inherit; font-size: 14px; padding: 10px 11px; border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--paper); color: var(--ink);
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn-primary {
    font: inherit; font-size: 14px; font-weight: 600; padding: 11px 22px; border-radius: 7px; border: none;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.5; cursor: wait; }
  .form-msg { font-size: 13px; font-weight: 500; text-align: center; min-height: 18px; }
  .form-msg.error { color: var(--critical); }
  .form-msg.ok { color: var(--accent); }
  .link-btn {
    background: none; border: none; padding: 0; font: inherit; font-size: 12.5px; color: var(--accent);
    text-decoration: underline; cursor: pointer; text-align: center;
  }
</style>
</head>
<body>

<form class="card" id="form-nueva">
  <div>
    <div class="marca">Cultivos Sayonara</div>
    <h1>Crea una nueva contraseña</h1>
  </div>
  <div class="field">
    <label for="np-password">Nueva contraseña</label>
    <input type="password" id="np-password" required minlength="8" autocomplete="new-password">
  </div>
  <div class="field">
    <label for="np-password2">Confirmar contraseña</label>
    <input type="password" id="np-password2" required minlength="8" autocomplete="new-password">
  </div>
  <button type="submit" class="btn-primary" id="btn-nueva">Guardar nueva contraseña</button>
  <div class="form-msg" id="nueva-msg"></div>
  <button type="button" class="link-btn" id="btn-a-login" hidden>Ir a iniciar sesión</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = "https://kgtwqywbowhllxqdjegi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtndHdxeXdib3dobGx4cWRqZWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMzQ4NjUsImV4cCI6MjEwMjkxMDg2NX0.NsrxM2EdIDvnmCPWjiNR3pBpcMXgPy8bQwagMOYAHHQ";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("form-nueva");
  const btn = document.getElementById("btn-nueva");
  const msg = document.getElementById("nueva-msg");
  const btnALogin = document.getElementById("btn-a-login");

  btnALogin.addEventListener("click", () => { location.href = "login.html"; });

  function bloquearFormulario(texto) {
    msg.textContent = texto;
    msg.className = "form-msg error";
    form.querySelectorAll("input, button[type=submit]").forEach((el) => { el.disabled = true; });
    btnALogin.hidden = false;
  }

  // El enlace del correo crea una sesion temporal de recuperacion. Si no hay
  // sesion, el enlace ya expiro, ya se uso, o es invalido.
  sb.auth.getSession().then(({ data }) => {
    if (!data.session) {
      bloquearFormulario("Este enlace no es válido o ya expiró. Solicita uno nuevo desde la pantalla de inicio de sesión.");
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = document.getElementById("np-password").value;
    const p2 = document.getElementById("np-password2").value;

    if (p1 !== p2) {
      msg.textContent = "Las contraseñas no coinciden.";
      msg.className = "form-msg error";
      return;
    }

    btn.disabled = true;
    msg.textContent = "Guardando...";
    msg.className = "form-msg";

    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) {
      msg.textContent = "No se pudo actualizar: " + error.message;
      msg.className = "form-msg error";
      btn.disabled = false;
      return;
    }

    await sb.auth.signOut();
    bloquearFormulario("Contraseña actualizada correctamente.");
    msg.className = "form-msg ok";
  });
})();
</script>
</body>
</html>
