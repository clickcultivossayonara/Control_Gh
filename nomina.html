<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nómina — Cultivos Sayonara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {
    --paper: #f6f5f0; --surface: #ffffff; --ink: #1d2420; --ink-soft: #57625b; --ink-faint: #8a9089;
    --line: #dbdfd4; --line-strong: #c4cabb; --accent: #2e6b4e; --accent-ink: #ffffff;
    --accent-soft: #e3eee6; --accent-soft-line: #c3ddca; --warn: #b3742f; --warn-soft: #f6e9d7;
    --critical: #a23d3d; --critical-soft: #f6e0e0;
    --shadow: 0 1px 2px rgba(29, 36, 32, 0.06), 0 4px 16px rgba(29, 36, 32, 0.05);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14180f; --surface: #1b211a; --ink: #eaf0e6; --ink-soft: #a8b3a3; --ink-faint: #6c766a;
      --line: #2c332a; --line-strong: #3b453a; --accent: #6fbf8f; --accent-ink: #0d1a10;
      --accent-soft: #223229; --accent-soft-line: #35503d; --warn: #e0a75c; --warn-soft: #3a2f1a;
      --critical: #e08080; --critical-soft: #3a2020;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14180f; --surface: #1b211a; --ink: #eaf0e6; --ink-soft: #a8b3a3; --ink-faint: #6c766a;
    --line: #2c332a; --line-strong: #3b453a; --accent: #6fbf8f; --accent-ink: #0d1a10;
    --accent-soft: #223229; --accent-soft-line: #35503d; --warn: #e0a75c; --warn-soft: #3a2f1a;
    --critical: #e08080; --critical-soft: #3a2020;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 22px 24px 48px; display: flex; flex-direction: column; gap: 22px; }

  .masthead { display: flex; flex-direction: column; align-items: center; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 16px; text-align: center; }
  .masthead h1 { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: clamp(26px, 4vw, 36px); margin: 0; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; }
  .masthead .sub { font-size: 13px; color: var(--ink-soft); }
  .masthead a { color: var(--accent); text-decoration: none; }
  .masthead a:hover { text-decoration: underline; }

  section.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; }
  h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 19px; margin: 0 0 16px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 160px; }
  .field.grow { flex: 1; min-width: 200px; }
  .field label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; }
  .checkbox-field { min-width: 0; }
  .checkbox-label {
    display: flex; align-items: center; gap: 6px; font-size: 13px; text-transform: none; letter-spacing: normal;
    color: var(--ink-soft); font-weight: 500; cursor: pointer; white-space: nowrap; padding-bottom: 9px;
  }
  .checkbox-label input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .field input, .field select {
    font: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--paper); color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .multiselect { position: relative; }
  .ms-trigger {
    font: inherit; font-size: 14px; padding: 9px 30px 9px 10px;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--paper); color: var(--ink); width: 100%; text-align: left; cursor: pointer; position: relative;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ms-trigger::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); font-size: 10px; }
  .ms-trigger:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .multiselect.open .ms-trigger { border-color: var(--accent); }
  .ms-panel {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
    min-width: 220px; max-height: 260px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
    box-shadow: var(--shadow); padding: 4px;
  }
  .multiselect.open .ms-panel { display: block; }
  .ms-search {
    display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 7px 8px;
    margin-bottom: 4px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--paper); color: var(--ink);
  }
  .ms-search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .ms-option { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 13.5px; white-space: nowrap; }
  .ms-option:hover { background: var(--accent-soft); }
  .ms-option input { margin: 0; accent-color: var(--accent); }

  .clear-btn {
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px;
    border-radius: 7px; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
  }
  .clear-btn:hover { border-color: var(--accent); color: var(--accent); }
  .excel-btn {
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px;
    border-radius: 7px; border: 1px solid var(--accent-soft-line);
    background: var(--accent-soft); color: var(--accent); cursor: pointer;
  }
  .excel-btn:hover { border-color: var(--accent); }
  .excel-btn:disabled { opacity: 0.6; cursor: wait; }
  .result-count { font-size: 12.5px; color: var(--ink-faint); margin-left: auto; align-self: center; white-space: nowrap; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 12.5px; table-layout: fixed; }
  thead th {
    position: sticky; top: 0; background: var(--ink); color: var(--paper); text-align: left; padding: 8px 8px;
    font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  thead th:hover { background: var(--accent); }
  thead th .arrow { opacity: 0.5; font-size: 9px; margin-left: 3px; }
  thead th.sorted .arrow { opacity: 1; }
  tbody td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody tr:hover td { background: var(--accent-soft); }
  tbody tr:nth-child(even) td { background: rgba(0,0,0,0.012); }
  tbody tr:nth-child(even):hover td { background: var(--accent-soft); }
  th:nth-child(1), td:nth-child(1) { width: 8%; }
  th:nth-child(2), td:nth-child(2) { width: 8%; }
  th:nth-child(3), td:nth-child(3) { width: 8%; }
  th:nth-child(4), td:nth-child(4) { width: 18%; }
  th:nth-child(5), td:nth-child(5) { width: 14%; }
  th:nth-child(6), td:nth-child(6) { width: 9%; }
  th:nth-child(7), td:nth-child(7) { width: 9%; }
  th:nth-child(8), td:nth-child(8) { width: 16%; }
  th:nth-child(9), td:nth-child(9) { width: 10%; }
  .cedula { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--ink-soft); }
  .nombre { font-weight: 500; }
  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .diff-pos { color: var(--accent); font-weight: 500; }
  .diff-neg { color: var(--critical); font-weight: 500; }
  .hn-ok { color: var(--accent); font-weight: 600; }
  .hn-alerta { color: var(--critical); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .hn-alerta svg { width: 14px; height: 14px; flex-shrink: 0; }
  .empty-state { padding: 40px 20px; text-align: center; color: var(--ink-faint); font-size: 14px; }
  .load-more-row td { text-align: center; padding: 14px; background: var(--paper) !important; }
  .load-more-btn {
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 20px; border-radius: 7px;
    border: 1px solid var(--accent-soft-line); background: var(--accent-soft); color: var(--accent); cursor: pointer;
  }
  .load-more-btn:hover { border-color: var(--accent); }

  footer { font-size: 12px; color: var(--ink-faint); text-align: center; }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <h1>Nómina</h1>
    <div class="sub">Cultivos Sayonara &middot; <a href="index.html">Inicio</a> &middot; <a href="empleados.html">Empleados</a> &middot; <a href="registro-biometrico.html">Registro Biométrico</a> &middot; <a href="novedades.html">Novedades</a></div>
    <div class="sesion-box" id="sesion-box"></div>
  </div>

  <section class="card">
    <h2>Consulta de nómina</h2>
    <div class="filters">
      <div class="field">
        <label for="f-desde">Desde</label>
        <input type="date" id="f-desde">
      </div>
      <div class="field">
        <label for="f-hasta">Hasta</label>
        <input type="date" id="f-hasta">
      </div>
      <div class="field">
        <label>Semana</label>
        <div class="multiselect" id="ms-semana"></div>
      </div>
      <div class="field">
        <label>Área</label>
        <div class="multiselect" id="ms-area"></div>
      </div>
      <div class="field grow">
        <label for="f-buscar">Cédula o nombre</label>
        <input type="text" id="f-buscar" placeholder="Ej. 1193599748 o Roqueme…" autocomplete="off">
      </div>
      <div class="field">
        <label>Novedad</label>
        <div class="multiselect" id="ms-novedad"></div>
      </div>
      <div class="field checkbox-field">
        <label for="f-solo-novedad" class="checkbox-label">
          <input type="checkbox" id="f-solo-novedad">
          <span>Solo con novedad</span>
        </label>
      </div>
      <div class="field checkbox-field">
        <label for="f-sin-marcacion" class="checkbox-label">
          <input type="checkbox" id="f-sin-marcacion">
          <span>Sin marcación</span>
        </label>
      </div>
      <button class="clear-btn" id="btn-limpiar">Limpiar filtros</button>
      <button class="excel-btn" id="btn-excel">Descargar Excel</button>
      <span class="result-count" id="result-count"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th data-key="fecha">Fecha <span class="arrow">↕</span></th>
            <th data-key="semana">Semana <span class="arrow">↕</span></th>
            <th data-key="cedula">Cédula <span class="arrow">↕</span></th>
            <th data-key="nombre">Nombre <span class="arrow">↕</span></th>
            <th data-key="area">Área <span class="arrow">↕</span></th>
            <th data-key="horas_trabajadas">Horas Trabajadas <span class="arrow">↕</span></th>
            <th data-key="diferencia_tiempo">Diferencia <span class="arrow">↕</span></th>
            <th data-key="codigo_descripcion">Novedad <span class="arrow">↕</span></th>
            <th data-key="horas_novedad">Horas Novedad <span class="arrow">↕</span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <footer>Datos en vivo desde Supabase &middot; Cultivos Sayonara</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
AUTH_READY.then(async function () {
  if (!requireRole(["admin", "nomina"])) return;
  pintarSesion("sesion-box");

  const SUPABASE_URL = "https://kgtwqywbowhllxqdjegi.supabase.co";
  const TODAS_LAS_AREAS = ["ADMINISTRACIÓN","ALSTROMERIA","AMBIENTAL","ASPERSIÓN","CALIDAD","CONFINAMIENTO CEJA","CORTE","CORTE CEJA","COSECHA ABUELAS CEJA","COSECHA CEJA","DESBOTONE","DESBOTONE CEJA","ESTERILIZACIÓN","FITOSANIDAD","LIMONIUM","MANTENIMIENTO","MANTENIMIENTO CEJA","MIPE CEJA","No Registrado","OFICIOS VARIOS","POSCOSECHA CEJA","POSTCOSECHA","PRODUCCIÓN CEJA","PROPAGACIÓN CONFINAMIENTO","PROPAGACIÓN COSECHA","REVISION POSCOSECHA","RIEGO","RIEGO CEJA","SERVICIOS","SERVICIOS CEJA","SIEMBRA","SIEMBRA CEJA","UNIQUE CREATION"];

  // ---------------- multiselect generico ----------------
  function crearMultiselect(containerId, opciones, etiquetaTodos, onChange) {
    const el = document.getElementById(containerId);
    const seleccion = new Set();
    el.innerHTML = `<button type="button" class="ms-trigger">${etiquetaTodos}</button><div class="ms-panel"></div>`;
    const trigger = el.querySelector(".ms-trigger");
    const panel = el.querySelector(".ms-panel");

    function actualizarEtiqueta() {
      if (seleccion.size === 0) trigger.textContent = etiquetaTodos;
      else if (seleccion.size === 1) trigger.textContent = [...seleccion][0];
      else trigger.textContent = `${seleccion.size} seleccionadas`;
    }

    panel.innerHTML = `<input type="text" class="ms-search" placeholder="Buscar…" autocomplete="off">` +
      opciones.map(a => `<label class="ms-option" data-texto="${a.toLowerCase()}"><input type="checkbox" value="${a}"><span>${a}</span></label>`).join("");
    const buscar = panel.querySelector(".ms-search");
    panel.querySelectorAll("input[type=checkbox]").forEach((chk) => {
      chk.addEventListener("change", () => {
        if (chk.checked) seleccion.add(chk.value);
        else seleccion.delete(chk.value);
        actualizarEtiqueta();
        if (onChange) onChange();
      });
    });
    buscar.addEventListener("click", (e) => e.stopPropagation());
    buscar.addEventListener("input", () => {
      const q = buscar.value.trim().toLowerCase();
      panel.querySelectorAll(".ms-option").forEach((opt) => {
        opt.style.display = opt.dataset.texto.includes(q) ? "" : "none";
      });
    });

    trigger.addEventListener("click", (e) => {
      e.stopPropagation();
      document.querySelectorAll(".multiselect.open").forEach(m => { if (m !== el) m.classList.remove("open"); });
      el.classList.toggle("open");
      if (el.classList.contains("open")) {
        buscar.value = "";
        panel.querySelectorAll(".ms-option").forEach(o => { o.style.display = ""; });
        buscar.focus();
      }
    });

    return {
      seleccion,
      limpiar() { seleccion.clear(); panel.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = false); actualizarEtiqueta(); },
    };
  }
  document.addEventListener("click", (e) => {
    document.querySelectorAll(".multiselect.open").forEach(m => { if (!m.contains(e.target)) m.classList.remove("open"); });
  });

  const msArea = crearMultiselect("ms-area", TODAS_LAS_AREAS, "Todas", () => reset());

  const OPCIONES_SEMANA = Array.from({ length: 53 }, (_, i) => String(i + 1));
  const msSemana = crearMultiselect("ms-semana", OPCIONES_SEMANA, "Todas", () => reset());

  async function cargarOpcionesNovedad() {
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/codigos_novedad?select=codigo_descripcion&habilitado=eq.true&order=codigo_descripcion.asc`, { headers: authHeaders() });
      const filas = await resp.json();
      return Array.isArray(filas) ? filas.map(f => f.codigo_descripcion) : [];
    } catch {
      return [];
    }
  }
  const msNovedad = crearMultiselect("ms-novedad", await cargarOpcionesNovedad(), "Todas", () => reset());

  const elDesde = document.getElementById("f-desde");
  const elHasta = document.getElementById("f-hasta");
  const elBuscar = document.getElementById("f-buscar");
  const elSoloNovedad = document.getElementById("f-solo-novedad");
  const elSinMarcacion = document.getElementById("f-sin-marcacion");
  const elBody = document.getElementById("tbody");
  const elCount = document.getElementById("result-count");

  function fechaISO(d) { return d.toISOString().slice(0, 10); }
  function fechasPorDefecto() {
    const hoy = new Date();
    const hace30 = new Date(); hace30.setDate(hace30.getDate() - 30);
    elDesde.value = fechaISO(hace30);
    elHasta.value = fechaISO(hoy);
  }

  const ICONO_ALERTA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;

  // Novedades de tipo compensatorio/permiso/licencia: no se comparan contra
  // la diferencia de horas biometricas, asi que quedan fuera del semaforo.
  const CODIGOS_SIN_VALIDACION = new Set(["B072", "B073", "CAP", "CD", "DF", "HEC", "LIR", "LMA", "LPA", "LPL", "PR", "VAC"]);

  function fila(r) {
    const ht = r.horas_trabajadas != null ? Number(r.horas_trabajadas).toFixed(2) : "—";
    let dt = "—";
    if (r.diferencia_tiempo != null) {
      const v = Number(r.diferencia_tiempo);
      const cls = v >= 0 ? "diff-pos" : "diff-neg";
      const signo = v > 0 ? "+" : "";
      dt = `<span class="${cls}">${signo}${v.toFixed(2)}</span>`;
    }
    let hn = "—";
    if (r.horas_novedad != null) {
      const valor = Number(r.horas_novedad);
      if (CODIGOS_SIN_VALIDACION.has(r.codigo_novedad)) {
        hn = String(valor);
      } else {
        const dif = r.diferencia_tiempo != null ? Number(r.diferencia_tiempo) : null;
        // Rojo + alerta solo si no hay con que comparar (sin datos
        // biometricos ese dia) o si la diferencia es negativa (no se
        // cumplio el horario). Con diferencia positiva o cero, siempre
        // verde, sin importar cuantas horas tenga la novedad.
        const esVerde = dif !== null && dif >= 0;
        hn = esVerde
          ? `<span class="hn-ok">${valor}</span>`
          : `<span class="hn-alerta">${valor}${ICONO_ALERTA}</span>`;
      }
    }
    return `<tr>
      <td class="num">${r.fecha}</td>
      <td class="num">${r.semana ?? "—"}</td>
      <td class="cedula">${r.cedula}</td>
      <td class="nombre" title="${r.nombre}">${r.nombre}</td>
      <td title="${r.area || ""}">${r.area || "—"}</td>
      <td class="num">${ht}</td>
      <td class="num">${dt}</td>
      <td title="${r.codigo_descripcion || ""}">${r.codigo_descripcion || "—"}</td>
      <td class="num">${hn}</td>
    </tr>`;
  }

  const RANGO_MAX_DIAS = 60;

  function rangoDemasiadoAmplio() {
    if (!elDesde.value || !elHasta.value) return false;
    const dias = (new Date(elHasta.value) - new Date(elDesde.value)) / (1000 * 60 * 60 * 24);
    return dias > RANGO_MAX_DIAS;
  }

  function aplicarFiltros(params) {
    if (elDesde.value) params.append("fecha", "gte." + elDesde.value);
    if (elHasta.value) params.append("fecha", "lte." + elHasta.value);
    if (msArea.seleccion.size) params.set("area", "in.(" + [...msArea.seleccion].map(a => `"${a}"`).join(",") + ")");
    if (msSemana.seleccion.size) params.set("semana", "in.(" + [...msSemana.seleccion].join(",") + ")");
    if (msNovedad.seleccion.size) params.set("codigo_descripcion", "in.(" + [...msNovedad.seleccion].map(c => `"${c}"`).join(",") + ")");
    else if (elSoloNovedad.checked) params.set("codigo_descripcion", "not.is.null");
    if (elSinMarcacion.checked) params.set("horas_trabajadas", "is.null");

    const buscar = elBuscar.value.trim();
    if (buscar) {
      if (/^\d+$/.test(buscar)) params.set("cedula_texto", "ilike.*" + buscar + "*");
      else params.set("nombre", "ilike.*" + buscar.replace(/[,()]/g, "") + "*");
    }
  }

  let visibles = 300;
  const PAGE = 300;
  function reset() { visibles = PAGE; cargar(); }

  let sortKey = "fecha", sortDir = -1;

  async function cargar() {
    if (rangoDemasiadoAmplio()) {
      elBody.innerHTML = `<tr><td colspan="9"><div class="empty-state">El rango de fechas es muy amplio (máximo ${RANGO_MAX_DIAS} días). Reduce el rango para consultar.</div></td></tr>`;
      elCount.textContent = "";
      return;
    }

    const params = new URLSearchParams();
    params.set("select", "fecha,cedula,nombre,area,horas_trabajadas,diferencia_tiempo,codigo_descripcion,horas_novedad,semana,codigo_novedad");
    params.set("order", `${sortKey}.${sortDir === 1 ? "asc" : "desc"}.nullslast`);
    params.set("limit", String(visibles));
    aplicarFiltros(params);

    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/nomina_consulta_detalle?${params.toString()}`, {
        headers: { ...authHeaders(), Prefer: "count=exact" },
      });
      const filas = await resp.json();
      if (!resp.ok) throw new Error(filas.message || `HTTP ${resp.status}`);
      const rango = resp.headers.get("content-range");
      const total = rango && rango.includes("/") ? Number(rango.split("/")[1]) : filas.length;

      if (filas.length === 0) {
        elBody.innerHTML = `<tr><td colspan="9"><div class="empty-state">Sin registros para estos filtros.</div></td></tr>`;
      } else {
        let html = filas.map(fila).join("");
        if (total > filas.length) {
          html += `<tr class="load-more-row"><td colspan="9">
            <button class="load-more-btn" id="btn-cargar-mas">Cargar más (${(total - filas.length).toLocaleString("es-CO")} restantes)</button>
          </td></tr>`;
        }
        elBody.innerHTML = html;
        const btnMas = document.getElementById("btn-cargar-mas");
        if (btnMas) btnMas.addEventListener("click", () => { visibles += PAGE; cargar(); });
      }
      elCount.textContent = total.toLocaleString("es-CO") + " resultado" + (total === 1 ? "" : "s") +
        (filas.length < total ? ` · mostrando ${filas.length.toLocaleString("es-CO")}` : "");
    } catch (err) {
      elBody.innerHTML = `<tr><td colspan="9"><div class="empty-state">Error al cargar: ${err.message || err}</div></td></tr>`;
      elCount.textContent = "";
    }

    document.querySelectorAll("thead th[data-key]").forEach((th) => {
      th.classList.toggle("sorted", th.dataset.key === sortKey);
      const arrow = th.querySelector(".arrow");
      if (arrow) arrow.textContent = th.dataset.key === sortKey ? (sortDir === 1 ? "↑" : "↓") : "↕";
    });
  }

  document.querySelectorAll("thead th[data-key]").forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = -1; }
      reset();
    });
  });

  async function exportarExcel() {
    if (rangoDemasiadoAmplio()) {
      alert(`El rango de fechas es muy amplio (máximo ${RANGO_MAX_DIAS} días). Reduce el rango para exportar.`);
      return;
    }
    const btn = document.getElementById("btn-excel");
    const textoOriginal = btn.textContent;
    btn.disabled = true;

    try {
      const filas = [];
      let offset = 0;
      const tamanoPagina = 1000;
      while (true) {
        btn.textContent = `Generando... (${filas.length.toLocaleString("es-CO")})`;
        const params = new URLSearchParams();
        params.set("select", "fecha,cedula,nombre,area,horas_trabajadas,diferencia_tiempo,codigo_descripcion,horas_novedad,semana,codigo_novedad");
        aplicarFiltros(params);
        params.set("limit", String(tamanoPagina));
        params.set("offset", String(offset));

        const resp = await fetch(`${SUPABASE_URL}/rest/v1/nomina_consulta_detalle?${params.toString()}`, { headers: authHeaders() });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const lote = await resp.json();
        filas.push(...lote);
        if (lote.length < tamanoPagina) break;
        offset += tamanoPagina;
      }

      const filasExcel = filas.map(r => ({
        "Fecha": r.fecha,
        "Semana": r.semana ?? "",
        "Cédula": r.cedula,
        "Nombre": r.nombre,
        "Área": r.area || "",
        "Horas Trabajadas": r.horas_trabajadas != null ? Number(r.horas_trabajadas) : "",
        "Diferencia": r.diferencia_tiempo != null ? Number(r.diferencia_tiempo) : "",
        "Novedad": r.codigo_descripcion || "",
        "Horas Novedad": r.horas_novedad != null ? Number(r.horas_novedad) : "",
      }));

      const ws = XLSX.utils.json_to_sheet(filasExcel);
      ws["!cols"] = [{ wch: 12 }, { wch: 8 }, { wch: 12 }, { wch: 32 }, { wch: 20 }, { wch: 14 }, { wch: 11 }, { wch: 24 }, { wch: 12 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Nomina");

      const hoy = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `nomina_${hoy}.xlsx`);
    } catch (err) {
      alert("No se pudo generar el Excel: " + (err.message || err));
    } finally {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    }
  }
  document.getElementById("btn-excel").addEventListener("click", exportarExcel);

  let buscarTimeout;
  function alCambiarFecha() {
    // La fecha es el filtro principal: si el usuario la ajusta a mano, la
    // semana preseleccionada ya no debe seguir restringiendo el resultado.
    msSemana.limpiar();
    reset();
  }
  elDesde.addEventListener("change", alCambiarFecha);
  elHasta.addEventListener("change", alCambiarFecha);
  elBuscar.addEventListener("input", () => { clearTimeout(buscarTimeout); buscarTimeout = setTimeout(reset, 300); });
  elSoloNovedad.addEventListener("change", reset);
  elSinMarcacion.addEventListener("change", reset);
  document.getElementById("btn-limpiar").addEventListener("click", () => {
    fechasPorDefecto();
    msArea.limpiar();
    msSemana.limpiar();
    msNovedad.limpiar();
    elBuscar.value = "";
    elSoloNovedad.checked = false;
    elSinMarcacion.checked = false;
    reset();
  });

  fechasPorDefecto();
  reset();
});
</script>
